<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth" class="screen active">
  <h1>skype</h1>
  <input id="username" type="text" placeholder="Логин (латиницей)" autocapitalize="none">
  <input id="email" type="email" placeholder="Почта" autocapitalize="none">
  <input id="password" type="password" placeholder="Пароль">
  <div id="authErr"></div>
  <button id="authBtn" class="btn">Войти</button>
  <button id="authSwitch" class="link"></button>
</div>

<div id="main" class="screen">
  <header>
    <span class="title" id="meName"></span>
    <button id="logout">Выйти</button>
  </header>
  <nav id="tabs">
    <button data-tab="contacts" class="on">Контакты</button>
    <button data-tab="search">Поиск</button>
  </nav>
  <div id="tab-contacts" class="tab on">
    <div id="requests"></div>
    <div id="friends"></div>
  </div>
  <div id="tab-search" class="tab">
    <input id="q" type="text" placeholder="Имя или логин">
    <div id="found"></div>
  </div>
</div>

<div id="chat" class="screen">
  <header>
    <button id="back">&#8592;</button>
    <span class="title" id="chatName"></span>
  </header>
  <div id="msgs"></div>
  <div id="send">
    <input id="text" type="text" placeholder="Сообщение">
    <button id="sendBtn">Отправить</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
