<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skype</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f2f2f2;color:#222}
.view{display:none;height:100%;flex-direction:column}
.view.active{display:flex}
header{background:#00aff0;color:#fff;padding:12px 14px;display:flex;align-items:center;font-size:18px}
header .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:16px;padding:4px 8px}
#auth{justify-content:center;padding:24px;background:#00aff0}
#auth h1{color:#fff;text-align:center;font-weight:300;font-size:44px;margin:0 0 20px}
#auth input{width:100%;padding:12px;margin-bottom:10px;border:0;font-size:16px}
.btn{width:100%;padding:12px;border:0;background:#fff;color:#0087bd;font-size:16px}
.link{background:none;border:0;color:#fff;margin-top:14px;font-size:14px;text-decoration:underline;width:100%}
#authErr{color:#fff;min-height:20px;font-size:14px;margin-bottom:6px}
#search{margin:10px;padding:10px;border:1px solid #ccc;font-size:16px;width:calc(100% - 20px)}
#contacts{flex:1;overflow-y:auto;background:#fff}
.contact{padding:12px 14px;border-bottom:1px solid #eee;display:flex;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;background:#00aff0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px;flex:none}
.cname{font-size:16px}
.cuser{font-size:13px;color:#888}
.empty{padding:20px;color:#888;text-align:center}
#msgs{flex:1;overflow-y:auto;padding:10px;background:#e9f6fc}
.m{max-width:80%;padding:8px 12px;margin-bottom:6px;word-wrap:break-word;clear:both;font-size:15px}
.m.me{background:#00aff0;color:#fff;float:right}
.m.him{background:#fff;float:left}
#send{display:flex;padding:8px;background:#fff;border-top:1px solid #ddd}
#send input{flex:1;padding:10px;border:1px solid #ccc;font-size:16px;min-width:0}
#send button{margin-left:8px;border:0;background:#00aff0;color:#fff;padding:0 16px;font-size:16px}
</style>
</head>
<body>

<div id="auth" class="view active">
  <h1>skype</h1>
  <input id="username" type="text" placeholder="Имя пользователя" autocapitalize="none" style="display:none">
  <input id="email" type="email" placeholder="Почта" autocapitalize="none">
  <input id="password" type="password" placeholder="Пароль">
  <div id="authErr"></div>
  <button id="authBtn" class="btn">Войти</button>
  <button id="authSwitch" class="link">Нет аккаунта? Зарегистрироваться</button>
</div>

<div id="list" class="view">
  <header><span class="title" id="meName">Контакты</span><button id="logout">Выйти</button></header>
  <input id="search" type="text" placeholder="Поиск людей">
  <div id="contacts"></div>
</div>

<div id="chat" class="view">
  <header><button id="back">&#8592;</button><span class="title" id="chatName"></span></header>
  <div id="msgs"></div>
  <div id="send">
    <input id="text" type="text" placeholder="Сообщение">
    <button id="sendBtn">Отправить</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL = 'https://lugzfticpstnucangubj.supabase.co';
var SUPABASE_KEY = 'sb_publishable_DZduC3v3HmYA1H46-FM_cQ_RyfgFK9o';

var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var me = null, myProfile = null, current = null;
var people = [], shown = {};
var registerMode = false;

function $(id) { return document.getElementById(id); }

function show(id) {
  var v = document.querySelectorAll('.view');
  for (var i = 0; i < v.length; i++) v[i].classList.remove('active');
  $(id).classList.add('active');
}

/* ---------- вход и регистрация ---------- */

function setMode(reg) {
  registerMode = reg;
  $('username').style.display = reg ? 'block' : 'none';
  $('authBtn').textContent = reg ? 'Создать аккаунт' : 'Войти';
  $('authSwitch').textContent = reg ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
  $('authErr').textContent = '';
}

$('authSwitch').onclick = function () { setMode(!registerMode); };

$('authBtn').onclick = async function () {
  var email = $('email').value.trim();
  var pass = $('password').value;
  var name = $('username').value.trim().toLowerCase();
  $('authErr').textContent = '';

  try {
    if (registerMode) {
      if (!name) { $('authErr').textContent = 'Введи имя пользователя'; return; }
      var r = await db.auth.signUp({ email: email, password: pass });
      if (r.error) { $('authErr').textContent = r.error.message; return; }
      if (!r.session) { $('authErr').textContent = 'Подтверди почту и войди'; setMode(false); return; }
      var p = await db.from('profiles').insert({ id: r.user.id, username: name, display_name: name });
      if (p.error) { $('authErr').textContent = 'Имя занято или некорректно'; return; }
      start(r.user);
    } else {
      var l = await db.auth.signIn({ email: email, password: pass });
      if (l.error) { $('authErr').textContent = 'Неверная почта или пароль'; return; }
      start(l.user);
    }
  } catch (e) {
    $('authErr').textContent = 'Нет связи с сервером';
  }
};

$('logout').onclick = async function () {
  await db.auth.signOut();
  location.reload();
};

/* ---------- контакты ---------- */

async function start(user) {
  me = user;
  var r = await db.from('profiles').select('*').eq('id', me.id);
  myProfile = (r.data && r.data[0]) || null;
  $('meName').textContent = myProfile ? myProfile.display_name : 'Контакты';
  await loadPeople();
  listenRealtime();
  show('list');
}

async function loadPeople() {
  var r = await db.from('profiles').select('*').neq('id', me.id).order('username');
  people = r.data || [];
  renderPeople('');
}

function renderPeople(q) {
  var box = $('contacts');
  box.innerHTML = '';
  var n = 0;
  people.forEach(function (p) {
    if (q && p.username.indexOf(q) === -1) return;
    n++;
    var row = document.createElement('div');
    row.className = 'contact';
    var ava = document.createElement('div');
    ava.className = 'ava';
    ava.textContent = (p.display_name || p.username).charAt(0).toUpperCase();
    var info = document.createElement('div');
    var nm = document.createElement('div');
    nm.className = 'cname';
    nm.textContent = p.display_name || p.username;
    var us = document.createElement('div');
    us.className = 'cuser';
    us.textContent = '@' + p.username;
    info.appendChild(nm);
    info.appendChild(us);
    row.appendChild(ava);
    row.appendChild(info);
    row.onclick = function () { openChat(p); };
    box.appendChild(row);
  });
  if (!n) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = q ? 'Никого не нашли' : 'Пока нет других пользователей';
    box.appendChild(e);
  }
}

$('search').oninput = function () { renderPeople(this.value.trim().toLowerCase()); };

/* ---------- чат ---------- */

async function openChat(p) {
  current = p;
  shown = {};
  $('chatName').textContent = p.display_name || p.username;
  $('msgs').innerHTML = '';
  show('chat');
  var a = 'and(sender.eq.' + me.id + ',receiver.eq.' + p.id + ')';
  var b = 'and(sender.eq.' + p.id + ',receiver.eq.' + me.id + ')';
  var r = await db.from('messages').select('*').or(a + ',' + b).order('created_at');
  (r.data || []).forEach(addMsg);
}

function addMsg(m) {
  if (shown[m.id]) return;
  shown[m.id] = true;
  var d = document.createElement('div');
  d.className = 'm ' + (m.sender === me.id ? 'me' : 'him');
  d.textContent = m.body;
  var box = $('msgs');
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  var t = $('text').value.trim();
  if (!t || !current) return;
  $('text').value = '';
  var r = await db.from('messages').insert({ sender: me.id, receiver: current.id, body: t });
  if (r.data && r.data[0]) addMsg(r.data[0]);
}

$('sendBtn').onclick = sendMsg;
$('text').onkeydown = function (e) { if (e.keyCode === 13) sendMsg(); };
$('back').onclick = function () { current = null; show('list'); };

function listenRealtime() {
  db.from('messages').on('INSERT', function (payload) {
    var m = payload['new'];
    if (m.receiver !== me.id) return;
    if (current && m.sender === current.id) addMsg(m);
  }).subscribe();
}

/* ---------- автоматический вход ---------- */

(function () {
  var s = db.auth.session();
  if (s && s.user) start(s.user);
})();
</script>
</body>
</html>
